<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bitcoin Arena · Node Owner</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f7931a'/%3E%3Ctext x='16' y='23' font-size='21' font-weight='700' font-family='system-ui,sans-serif' text-anchor='middle' fill='%23fff'%3E%E2%82%BF%3C/text%3E%3C/svg%3E">
<!-- THE OWNER AREA OF A NODE: /Dashboard/owner. The owner is a key made from 24 words this browser keeps;
     every request it sends is signed with it (src/owner.js). Nothing here is a password, and nothing leaves the browser
     but public keys and signatures. -->
<style>
:root{--bg:#0f1218;--card:#171c25;--line:#2a3140;--text:#e6e9ef;--dim:#8b93a3;--gv:#f2a93b;--st:#4fa3ff;--ok:#3fbf7f;--bad:#e25c5c;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f5f6f8;--card:#fff;--line:#dde1e7;--text:#1b2230;--dim:#5d6676;color-scheme:light}}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;padding:16px;max-width:1080px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:14px;margin:22px 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.sub{color:var(--dim);margin-bottom:14px;overflow-wrap:anywhere}.dash-facts{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 16px}.fact{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card,#161b22);font-size:13px;max-width:100%;color:var(--text,#e6edf3)}.fact code{font:12.5px ui-monospace,monospace}.fact-k{color:var(--dim);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}.fact-copy{border:0;background:transparent;color:var(--st);font:600 12px system-ui;padding:0;cursor:pointer}a{color:var(--st)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:16px}.card p{margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 10px;padding:4px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row b{overflow-wrap:anywhere;text-align:right}
.path{display:flex;gap:8px;align-items:center;margin:6px 0 12px}.path code{flex:1;min-width:0;overflow-wrap:anywhere;user-select:all;padding:6px 8px;border:1px solid var(--line);border-radius:6px}.path button{flex:none;width:auto;margin:0}
button{font:600 15px system-ui;border-radius:10px;padding:11px 16px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;margin:4px 6px 4px 0}
button.primary{background:var(--gv);border-color:var(--gv);color:#1a1200}button:disabled{opacity:.5;cursor:default}
input,textarea{width:100%;font:15px ui-monospace,monospace;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
textarea{min-height:110px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:10px 0;counter-reset:w}
.words span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:14px ui-monospace,monospace}
.words span::before{counter-increment:w;content:counter(w) ". ";color:var(--dim)}
.warn{border-left:3px solid var(--gv);padding:8px 12px;background:rgba(242,169,59,.08);border-radius:0 8px 8px 0;margin:10px 0}
.err{color:var(--bad);min-height:1.5em}.ok{color:var(--ok)}
label{display:block;margin:8px 0 4px;color:var(--dim)}
  .info { margin: 2px 0 6px; } .info a { color: inherit; }
  /* the dev key's earnings by period: scrolls sideways on a phone, numbers right-aligned */
  .tablewrap { overflow-x: auto; } table.earn { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  table.earn th, table.earn td { padding: 4px 6px; text-align: right; white-space: nowrap; border-bottom: 1px solid rgba(255,255,255,0.06); } table.earn tbody th { text-align: left; font-weight: 500; }
/* THE SECTIONS (kanban #553): a sidebar beside one section at a time; on a phone the sidebar is a menu that scrolls sideways at the top */
.layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:24px;align-items:start}
nav.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px}
nav.side a{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:9px;color:var(--text);text-decoration:none}
nav.side a:hover{background:var(--card)}nav.side a.on{background:var(--card);border:1px solid var(--line);font-weight:600}
/* the public dashboard as a menu entry (kanban #733), set apart from the sections */nav.side a.out{margin-top:10px}
.dot{width:9px;height:9px;min-width:9px;border-radius:50%;flex:0 0 9px;display:inline-block}.dot:not(.d-bad):not(.d-warn){visibility:hidden}.dot.d-bad{background:var(--bad)}.dot.d-warn{background:var(--gv)}
main section h2{margin-top:4px}.lead{color:var(--dim);margin:0 0 12px}h3.sh{font-size:15px;margin:18px 0 6px}
details.more>summary,details>summary{cursor:pointer;color:var(--st);margin:8px 0}
.warnline{border-left:3px solid var(--gv);padding-left:10px}.answer{font-size:17px;margin:0 0 8px}.mono{font-family:ui-monospace,monospace}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 2px}.bar>div{height:100%;background:var(--gv)}
.steps{margin:12px 0;padding-left:20px}.steps li{margin:8px 0}.qr{background:#fff;padding:8px;border-radius:10px;width:200px;margin:8px 0}.qr svg{display:block;width:100%;height:auto}
h3.offer{font-size:20px;color:var(--gv)}
/* THE ROLES AS TILES (kanban #563, 2026-10-21: "you must vamp it up so it looks modern"): one card per role, its earning in one
   line, a switch where it can be changed, the save bar only once something changed */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,box-shadow .15s}
.tile.on{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}.tile.changed{border-color:var(--gv);box-shadow:0 0 0 1px var(--gv) inset}
.tile .head{display:flex;align-items:center;gap:10px}.tile h4{margin:0;font-size:16px;flex:1;min-width:0}
.tile .ico{font-size:20px;width:38px;height:38px;min-width:38px;border-radius:10px;display:grid;place-items:center;background:var(--bg)}
.tile .earn{color:var(--gv);font-weight:600;font-size:14px;margin:0}.tile .does{color:var(--dim);font-size:14px;margin:0;flex:1}
.tile .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.pill{font:600 12px system-ui;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--dim);white-space:nowrap}
.pill.on{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.pill.wait{background:color-mix(in srgb,var(--gv) 18%,transparent);color:var(--gv)}
.switch{position:relative;display:inline-block;width:48px;height:28px;margin:0;flex:0 0 48px;cursor:pointer}.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.switch span::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--ok)}.switch input:checked+span::after{transform:translateX(20px)}.switch input:focus-visible+span{outline:2px solid var(--st);outline-offset:2px}
.tile a.go{color:var(--st);font-weight:600;font-size:14px;text-decoration:none}
.savebar{position:sticky;bottom:12px;z-index:4;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;background:var(--card);border:1px solid var(--gv);border-radius:14px;padding:10px 14px;margin-top:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.savebar[hidden]{display:none}
.confirm{display:flex;gap:10px;align-items:flex-start;margin:10px 0;color:var(--text)}.confirm input{width:auto;margin-top:4px}
/* THE MODERN LOOK, EVERY SECTION (kanban #565, 2026-10-21: "make the rest of the owners page modern everywhere, not just the roles
   screen"): larger section titles, softer cards, key-value rows that read as label and value, compact buttons, a summary bar on top of a
   section, and the services as a grid of status cards */
body{max-width:1180px;padding:20px}h1{font-size:22px;font-weight:750;letter-spacing:-.01em}
main section h2{font-size:22px;color:var(--text);text-transform:none;letter-spacing:-.01em;font-weight:750;margin:2px 0 4px}
.card{border-radius:16px;padding:18px 20px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 6px 18px rgba(0,0,0,.18)}
.row{padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);align-items:baseline}.row>span{color:var(--dim)}.row b{font-weight:650}
button{font-size:14px;padding:9px 14px}button.mini{padding:5px 11px;font-size:13px;border-radius:8px;margin:0}button:hover:not(:disabled){border-color:var(--dim)}
h3.sh{font-size:13px;margin:20px 0 10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
nav.side a{font-size:14.5px}nav.side a.on{border-color:transparent;box-shadow:inset 3px 0 0 var(--gv)}
.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin:6px 0 4px}
.summary.good{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}.summary.bad{border-color:var(--bad)}.summary b{display:block;font-size:17px}.summary .sub{margin:0;display:block}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
/* the Rounds section (kanban #715) */
#rounds-why{background:color-mix(in srgb,var(--gv) 12%,transparent);border-radius:10px;padding:10px 12px;margin:0 0 10px}
table.rounds{width:100%;border-collapse:collapse;font-size:14px}table.rounds th{text-align:left;color:var(--dim);font-weight:600;padding:4px 6px}table.rounds td{padding:6px;border-top:1px solid var(--line,#8883)}table.rounds tr.done td{color:var(--dim)}
@media (max-width:640px){table.rounds th:nth-child(1),table.rounds td:nth-child(1){white-space:nowrap;font-size:12px}}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.svc-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}.svc-card.down{border-color:var(--bad)}
.svc-head{display:flex;align-items:center;gap:10px}.svc-name{flex:1;min-width:0;font-size:15px}
.led{width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:var(--dim)}.led.up{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}
.led.down{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 20%,transparent)}
.svc-says{margin:0;color:var(--dim);font-size:13.5px;overflow-wrap:anywhere;flex:1}.svc-pid{opacity:.7}.svc-why{margin:0;color:var(--dim);font-size:13px}
.svc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.svc-btns{display:flex;gap:6px;flex-wrap:wrap}
/* THE DEV CLIENTS AT ONE PEEK (kanban #578): a wide card per client - the cash ready to withdraw, four chips, the split as a bar */
.devhero{background:linear-gradient(135deg,color-mix(in srgb,var(--gv) 9%,var(--card)),var(--card) 55%);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin:12px 0 16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.dh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:nowrap}.dh-who{flex:1;min-width:0}.dh-cash{flex:0 0 auto}.dh-who b{font-size:18px;text-transform:capitalize}.dh-who small{display:block;color:var(--dim);font-size:12.5px;margin-top:6px}
.dh-cash{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}.dh-cash span{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.dh-cash b{font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}.dh-cash button{margin:10px 0 0;min-width:150px}
.dh-share{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;color:var(--dim);font-size:12.5px}.dh-share>.sub{margin-right:2px}.dh-share>span:not(.sub){background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px}.dh-share b{color:var(--text);font-size:13.5px}.dh-share>span.own{border-color:var(--ok)}.dh-share>span.own b{color:var(--ok)}
.dh-withdraw{margin:16px 0 4px;padding:14px 16px;background:color-mix(in srgb,var(--bg) 75%,transparent);border:1px solid var(--line);border-radius:14px}.dh-withdraw label{margin-top:0}
.dh-bar{height:12px;cursor:pointer}.dh-bar i{transition:filter .15s,transform .15s}.dh-bar i.on{filter:brightness(1.25)}/* HOVER WITHOUT MOVING ANYTHING (2026-10-22: "die unteren Elemente springen"): the bar grows by transform, never by height */.dh-bar{transform-origin:center;transition:transform .15s}.dh-bar:hover{transform:scaleY(1.5)}
.dh-tip{height:22px;margin:8px 0 0;font-size:13.5px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dh-tip i{flex:0 0 10px}.dh-tip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.dh-legend div{border-radius:8px;padding:2px 4px;margin:-2px -4px;transition:background .15s}.dh-legend div.on{background:color-mix(in srgb,var(--text) 8%,transparent)}
.open-head{color:var(--gv)!important}.card.open-prop{border-color:var(--gv);box-shadow:0 0 0 1px var(--gv) inset}
.cur-pick{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 12px;color:var(--dim);font-size:13px}.cur-pick span{margin-right:4px}.cur-pick button{margin:0;padding:6px 12px;font-size:13px;border-radius:999px;background:var(--bg)}.cur-pick button.on{background:var(--gv);border-color:var(--gv);color:#1a1200}
.dh-chips small{display:block;color:var(--dim);font-size:11.5px}.dh-cash small{color:var(--dim);font-size:12px}
.dh-chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0 14px}.dh-chips div{background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dh-chips span{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}.dh-chips b{font-size:17px;font-variant-numeric:tabular-nums}
.dh-bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--bg);gap:2px}.dh-bar i{display:block;min-width:3px}
.dh-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 18px;margin-top:12px}.dh-legend div{display:grid;grid-template-columns:10px 1fr auto;column-gap:8px;align-items:center}
.dh-legend i{width:10px;height:10px;border-radius:3px}.dh-legend b{font-variant-numeric:tabular-nums;font-size:14px}.dh-legend small{grid-column:2/4;color:var(--dim);font-size:12px}
@media (max-width:640px){.dh-top{flex-wrap:wrap}.dh-chips{grid-template-columns:repeat(2,minmax(0,1fr))}.dh-cash{align-items:flex-start;text-align:left}.dh-cash b{font-size:28px}}
/* THE SPLIT, PRETTY (kanban #578): a bar per set, a row per developer - a select of known developers, the share, an optional vesting */
select{font:500 14.5px system-ui;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 34px 9px 12px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
select:focus{outline:2px solid var(--st);outline-offset:1px}
.split-bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--bg);gap:2px;margin:10px 0}.split-bar i{display:block;min-width:3px}
.split-total{font-weight:700;font-size:13.5px;margin:0 0 12px}.split-total.ok{color:var(--ok)}.split-total.warn{color:var(--gv)}
.split-row{display:grid;grid-template-columns:12px minmax(180px,1.4fr) 110px minmax(230px,1.3fr) 36px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.split-row .dot{display:block;width:12px;height:12px;border-radius:4px}.split-row .dot:not(.d-bad):not(.d-warn){visibility:visible}.split-row .who{display:flex;flex-direction:column;gap:6px;min-width:0}.split-row .who small{color:var(--dim);font:12px ui-monospace,monospace}
.split-row input{margin:0}.split-row .pct{display:flex;align-items:center;gap:6px;margin:0}.split-row .pct input{width:72px;text-align:right;font-size:16px;font-weight:700}
.split-row .vest{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;flex-wrap:wrap}.split-row .vest input{width:58px;text-align:right}
.split-row button.x{margin:0;padding:6px 0;width:36px;font-size:18px;line-height:1;color:var(--dim)}.split-row button.x:hover{color:var(--bad);border-color:var(--bad)}
.split-go{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.split-go label{margin:0;color:var(--dim)}.split-go button{margin:0}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat>span{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}.stat>b{font-size:19px;overflow-wrap:anywhere}
.stat>small{color:var(--dim);font-size:12.5px;overflow-wrap:anywhere}

   each app a card with its initial, name and version, the update settings as a settings card with a switch */
.dt-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}.dt-head h3{margin:0}.dt-sum{color:var(--dim);font-size:13.5px}.dt-sum b{color:var(--text)}.dt-sum small{margin-left:4px}
.dt-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:12px 0}.dt-bar label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0}.dt-bar .grow{flex:1;min-width:180px}.dt-bar select,.dt-bar input{margin:0;min-width:0;text-transform:none;letter-spacing:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.seg button{margin:0;border:0;border-radius:0;padding:7px 12px;font-size:13px;background:var(--bg)}.seg button.on{background:var(--gv);color:#1a1200}
.dt .dt-row{cursor:pointer}.dt .dt-row:hover td,.dt .dt-row.on td{background:color-mix(in srgb,var(--gv) 7%,transparent)}.dt td.dim{color:var(--dim);white-space:nowrap}.dt td.win{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}.dt td.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}.dt td.n small{display:block;color:var(--dim);font-size:11.5px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:color-mix(in srgb,var(--st) 18%,transparent);margin-right:4px;white-space:nowrap}.tag.item{background:color-mix(in srgb,#e57ab0 22%,transparent)}.tag.mk{background:color-mix(in srgb,var(--ok) 20%,transparent)}.tag.dim{background:color-mix(in srgb,var(--line) 60%,transparent);color:var(--dim)}
.dt-more td{background:color-mix(in srgb,var(--gv) 4%,transparent)}.dt-rec{display:grid;gap:6px}.dt-rec div{display:flex;gap:10px;align-items:baseline;min-width:0}.dt-rec span{flex:0 0 90px;color:var(--dim);font-size:12px}.dt-rec code{font-size:12px;word-break:break-all}
.dt-pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--dim)}.dt-pager button{margin:0}.dt-pager button:disabled{opacity:.4;cursor:default}

<main>
<h1>Bitcoin Arena · Node Owner <span class="ver" id="ver"></span></h1>

<script type="module">
// The node's address: this page is <base>/Dashboard/owner, its doors are <base>/owner...
// THE OWNER PAGE ON THE ARENA SITE (kanban #668, the owner's playtest 2026-10-25: logged out after a restart - "Das reicht nicht wenn der
// Server Remote ist. Der installer soll es in die Session rein kopieren auch wenn sich die url geändert hat"): the same page at
// <site>/owner/#node=<the node's key>. A quick tunnel's address changes at every restart, the browser keeps a login per address - here the
// address stays the site's, the login is kept per node key, and the node is found where it is now: the seats' signed address announcements
// (GET /address-announcements, #562) name its current address. The node that answers there must be that key (checked in start()).
const ON_SITE = !/\/[Dd]ashboard\/owner\/?$/.test(location.pathname);
const OWNER_SITE = 'https://testnet.bitcoin-arena.io/owner/';   // the Arena site's owner page (installer FinishSteps OWNER_SITE, bitcoinarena open)
// A RELOAD KEEPS THE NODE (kanban #764, the owner: "Refresh on the logged-in owner page loses the login"): the area's menu and its links
// are plain #section anchors (OwnerArea, RolesPanel goTo), and each one replaced the whole # - node=, local=, url= went with it, and a
// reload found no node key. Every # the page moves to keeps the node's own part beside the section (section=, which OwnerArea reads), and
// this tab remembers it too (sessionStorage), for a # typed by hand. Only the node's public key and its address: no secret, and a # is
// never sent to a server
const NODE_PARTS = ['node', 'local', 'url'], NODE_TAB = 'arena-owner-node';
function withNode(raw, kept) {
  raw = String(raw || '').replace(/^#/, '');
  const h = new URLSearchParams(raw.includes('=') ? raw : '');
  if (raw && !raw.includes('=')) h.set('section', decodeURIComponent(raw));
  if (/^[0-9a-f]{64}$/i.test(h.get('node') || '')) return { hash: raw, kept: Object.fromEntries(NODE_PARTS.filter((k) => h.has(k)).map((k) => [k, h.get(k)])) };
  if (!kept || !/^[0-9a-f]{64}$/i.test(String(kept.node || ''))) return { hash: raw, kept: null };
  const out = new URLSearchParams();
  for (const k of NODE_PARTS) if (kept[k]) out.set(k, kept[k]);
  for (const [k, v] of h) if (!out.has(k)) out.set(k, v);
  return { hash: out.toString(), kept };
}
if (ON_SITE) {
  let kept = null;
  try { kept = JSON.parse(sessionStorage.getItem(NODE_TAB) || 'null'); } catch {}
  const keepNode = () => {
    const r = withNode(location.hash, kept);
    if (!r.kept) return;
    kept = r.kept;
    try { sessionStorage.setItem(NODE_TAB, JSON.stringify(kept)); } catch {}
    if (r.hash !== location.hash.slice(1)) history.replaceState(history.state, '', location.pathname + location.search + '#' + r.hash);
  };
  keepNode();
  addEventListener('hashchange', keepNode);   // before the area's own listener: it reads the section from the # kept here
}
const BOOT_T0 = Date.now();
let bootStep = 'Finding your node';
/** The loading bar: how far, and what the page waits for now, with the seconds since it opened. */
function boot(pct, step) {
  if (step) bootStep = step;
  const i = document.getElementById('boot-i'), t = document.getElementById('boot-t');
  if (i && pct != null) i.style.width = pct + '%';
  if (t) t.textContent = `${bootStep}… ${Math.round((Date.now() - BOOT_T0) / 1000)} s`;

const bootTick = setInterval(() => { if (!document.getElementById('boot')) clearInterval(bootTick); else boot(null); }, 1000);
const HASH = new URLSearchParams(location.hash.slice(1));
const NODE_KEY = ON_SITE ? String(HASH.get('node') || '').trim().toLowerCase() : null;
async function siteBase() {
  if (HASH.get('url')) return String(HASH.get('url')).replace(/\/+$/, '');
  if (!/^[0-9a-f]{64}$/.test(NODE_KEY || '')) return null;
  let seats = ['https://tn4.bitcoin-arena.io/guardian-1', 'https://tn4.bitcoin-arena.io/guardian-2', 'https://tn4.bitcoin-arena.io/guardian-3'];
  try { const d = await (await fetch('/daily.json', { cache: 'no-store' })).json(); const t = (d && d.testnet) || d || {}; if (Array.isArray(t.node) && t.node.length) seats = t.node; } catch {}
  // THE NEWEST ADDRESS THAT ANSWERS (kanban #809, measured 2026-10-30 ~11:2xZ: the owner waited 2-3 minutes on "loading…" - Beelink
  // seats 1 and 2, outside the census the node announces to, still named its quick tunnel of 10:14Z, gone since its restart; they answered
  // first, and the page asked that dead address until the browser gave up). Every seat is asked at once; from the first that names the
  // node, the others get 3 s more; the addresses are tried newest first, each for 4 s, and the first that answers is the node's
  const named = [];

    let left = seats.length, grace = null;
    const settle = () => { if (--left <= 0) done(); };
    setTimeout(done, 15000);
    for (const seat of seats) {
      fetch(seat.replace(/\/+$/, '') + '/address-announcements', { cache: 'no-store', signal: AbortSignal.timeout(15000) }).then((r) => r.json()).then((j) => {
        const e = ((j && j.announcements) || []).find((x) => x && x.node === NODE_KEY && /^https?:\/\//.test(x.endpoint || ''));
        if (e) { named.push(e); if (!grace) grace = setTimeout(done, 3000); }
      }).catch(() => {}).finally(settle);
    }
  });
  const tried = new Set();
  for (const e of named.sort((a, b) => Number(b.atMs) - Number(a.atMs))) {
    const u = e.endpoint.replace(/\/+$/, '');
    if (tried.has(u)) continue; tried.add(u);

  // the node's own page named (local=); start() still checks that the node answering is this key
  const local = String(HASH.get('local') || '').replace(/\/+$/, '');

// hand-over below the lookup, so its key was never kept): the keys it writes need no address
const LOCAL_PATH = location.pathname.replace(/\/[Dd]ashboard\/owner\/?$/, '');

// THE KEY FROM THE INSTALLER (kanban #668): opened by the installer's last button with owner-handoff in its #, this page asks its opener
// for the owner key - window to window, never in a URL - and keeps it here, so the owner area opens logged in at an address that stays

    const d = e.data;

      // provide links"): `keys` names each node by its key, and each owner key is kept under that node, as its own page keeps it
      if (ON_SITE && Array.isArray(d.keys)) for (const k of d.keys) {

        else if (k.kind === 'nsec' && /^[0-9a-f]{64}$/.test(k.secret)) localStorage.setItem('arena-owner-nostr:node:' + k.node, JSON.stringify({ how: 'nsec', secret: k.secret }));

// THE GAME DEVELOPERS (kanban #582): shown only when a game developer's key is installed here (GameDevsPanel, GET /owner/app-devs); installing
// one, removing it and a new split each the owner's signed request
async function gameDevs() {
  let r = null, why = null;
  try { r = await (await fetch(at('/owner/app-devs'), { cache: 'no-store' })).json(); } catch (e) { why = e.message; }
  devsHere.keys = !!(r && (r.devs || []).length); showDonations();
  const addKey = (key) => post('/owner/apps/dev-key', signed('apps/dev-key', { key }));
  if ($('gamedev-add')) O.drawInto($('gamedev-add'), 'GameDevsPanel', { devs: [], part: 'add', reread: gameDevs, addKey });
  if (!$('gamedevs')) return;
  O.drawInto($('gamedevs'), 'GameDevsPanel', { devs: r ? r.devs : [], why, part: 'main', reread: gameDevs,
    addKey: (key) => post('/owner/apps/dev-key', signed('apps/dev-key', { key })),
    removeKey: (pubkey) => post('/owner/apps/dev-key', signed('apps/dev-key', { remove: pubkey })),
    changeSplit: (game, recipients) => post('/owner/apps/split', signed('apps/split', { game, recipients })) });
}
// drawn by React (kanban #564, DevClients) from GET /owner/dev, again in the same root after a change (a form being typed keeps its words);
// a withdrawal asked is followed every 3 s until it is no longer paying (40 looks at most)
async function devClients() {
  let r = null, why = null;
  try { r = await (await fetch(at('/owner/dev'), { cache: 'no-store' })).json(); } catch (e) { why = e.message; }
  // REFERRAL PROGRAMS (kanban #675) are the clients of kind 'referrer': drawn in Referrer, kept out of Donations
  const programs = r && Array.isArray(r.clients) ? r.clients.filter((c) => c.kind === 'referrer') : [];
  if (r && Array.isArray(r.clients)) r = { ...r, clients: r.clients.filter((c) => c.kind !== 'referrer') };
  if ($('referrer')) O.drawInto($('referrer'), 'ReferrerPanel', { programs, why: r ? null : why, site: 'https://testnet.bitcoin-arena.io', reread: devClients,
    create: (name) => post('/owner/referrer/setup', signed('referrer/setup', { name })),
    withdraw: (args) => post('/owner/dev/withdraw', signed('dev/withdraw', args)),
    follow: (slug) => { let n = 0; const poll = () => { devClients(); if (++n < 20) setTimeout(poll, 3000); }; setTimeout(poll, 3000); } });
  devsHere.clients = !!(r && ((r.clients || []).length || r.beside)); showDonations();
  if ($('dev-add')) O.drawInto($('dev-add'), 'DevClients', { dev: r, why, part: 'add', reread: devClients, setup: (args) => post('/owner/dev/setup', signed('dev/setup', args)) });
  O.drawInto($('devs'), 'DevClients', { dev: r, why, part: 'main', reread: devClients,
    setup: (args) => post('/owner/dev/setup', signed('dev/setup', args)),
    withdraw: (args) => post('/owner/dev/withdraw', signed('dev/withdraw', args)),
    remove: (slug) => post('/owner/dev/remove', signed('dev/remove', { slug })),
    query: async (q) => (await fetch(at('/owner/dev/donations?' + new URLSearchParams(Object.entries(q).filter(([, v]) => v !== '' && v !== undefined))), { cache: 'no-store' })).json(),
    follow: (slug, id) => {
      const poll = async (n) => {
        await devClients();
        const v = ((await (await fetch(at('/owner/dev'), { cache: 'no-store' })).json()).clients || []).find((c) => c.slug === slug);
        const q = v && (v.requests || []).find((x) => x.id === id);
        if ((!q || q.state === 'Paying') && n < 40) setTimeout(() => poll(n + 1), 3000);
      };
      setTimeout(() => poll(0), 3000);
    } });
}
// THE NODE AS A CHIP (2026-10-26, the owner on "Node b36828faa1570202...261e" under the title: "Owner page header has the same bad
// layout"): its key short with a copy button, as on the dashboard
function showNode(key) {
  const w = $('who'); w.textContent = ''; w.className = 'dash-facts';
  const chip = document.createElement('span'); chip.className = 'fact'; chip.title = key;
  const k = document.createElement('span'); k.className = 'fact-k'; k.textContent = 'Node';
  const c = document.createElement('code'); c.textContent = String(key).slice(0, 8) + '…' + String(key).slice(-6);
  const COPY_ICON = '<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6"/><path d="M10.5 3.2V3a1.5 1.5 0 0 0-1.5-1.5H3A1.5 1.5 0 0 0 1.5 3v6A1.5 1.5 0 0 0 3 10.5h.2"/></svg>';
  const b = document.createElement('button'); b.type = 'button'; b.className = 'fact-copy copy-ic'; b.title = 'Copy'; b.innerHTML = COPY_ICON; b.setAttribute('aria-label', 'Copy the node key');
  // an icon, not the word (kanban #717, 2026-10-26: "As a copy icon, not as Copy"); a tick for a moment once copied
  // a refused write says so and selects the key instead of ticking (kanban #852)
  b.onclick = async () => {
    let done = true;
    try { await navigator.clipboard.writeText(key); } catch { done = false; c.textContent = key; const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    b.textContent = done ? '✓' : '✕'; b.title = done ? 'Copied' : 'Copy failed: the key is selected, copy it by hand';
    setTimeout(() => { b.innerHTML = COPY_ICON; b.title = 'Copy'; }, done ? 1500 : 4000);
  };
  chip.append(k, c, b); w.append(chip);
}
async function start() {
  areaProps = null; needs.clear();   // a new start draws no old area again
  $('public-line').hidden = false;
  try { state = await (await fetch(at('/owner'), { cache: 'no-store' })).json(); }
  catch (e) { $('who').textContent = 'This node did not answer: ' + e.message; return; }
  boot(90, 'Signing in');
  showNode(state.node);
  // THE OWNER'S LOGIN IS ON THE ARENA SITE (kanban #687, the owner's playtest 2026-10-26 on 1.9.7: "the owner page still points to
  // http://127.0.0.1:8770/dashboard/owner which doesn't have my secret"): the installer hands the owner key to the site's owner page,
  // kept per node key there; this page keeps a login per address. Opened here with no login of its own on a node that has an owner, it
  // goes to the site's page for this node (?here stays)
  if (!ON_SITE && state.claimed && !readSeed() && !readNostr() && !new URLSearchParams(location.search).has('here')) {
    location.replace(OWNER_SITE + '#node=' + state.node + '&local=' + encodeURIComponent(location.origin));
    return;
  }
  if (ON_SITE && NODE_KEY && state.node !== NODE_KEY) { $('who').textContent = 'The address announced for ' + NODE_KEY.slice(0, 16) + '… answers as another node (' + String(state.node).slice(0, 16) + '…). Try again in a minute.'; return; }
  let id = null;
  try { id = await identity(); }
  catch (e) { message({ title: 'Your Nostr login did not answer', err: e.message, buttons: [{ label: 'Try again', onClick: () => { me = null; start(); } }, { label: 'Sign out on this browser', onClick: forget }] }); return; }
  if (!id) return welcome();
  const mine = id.pubkey;
  if (!state.claimed) return claim(mine, state.claimFile);
  if (state.owner !== mine) {
    message({ title: 'This key is not this node\'s owner', text: 'This node belongs to another key. Sign in with the right 24 words or Nostr key, or forget this one.',
      buttons: [{ label: 'Sign out on this browser', onClick: forget }] }); return;
  }
  return area();
}
start();
